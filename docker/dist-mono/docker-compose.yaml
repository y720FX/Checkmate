services:
  server:
    image: ghcr.io/bluewave-labs/checkmate-backend-mono:latest
    pull_policy: always
    restart: always
    ports:
      - "52345:52345"
    environment:
      - UPTIME_APP_API_BASE_URL=${SERVICE_URL_SERVER}/api/v1
      - UPTIME_APP_CLIENT_HOST=${SERVICE_URL_SERVER}
      - DB_CONNECTION_STRING=mongodb://mongodb:27017/uptime_db
      - CLIENT_HOST=${SERVICE_URL_SERVER}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
    depends_on:
      - mongodb

  mongodb:
    image: ghcr.io/bluewave-labs/checkmate-mongo:latest
    restart: always
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - ./mongo/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30